<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- §260 sandbox-strict CSP. Everything is 'none' except two things: the app's
         own entry script, and `blob:` for the plugin bundle.

         `asset:` is deliberately ABSENT (§260 Phase 3c-2b — it was here in 3c-2a and
         its removal is the fix). Tauri v2's asset scope is APP-GLOBAL — there is no
         per-webview scope — and at runtime it covers $APPDATA/**, the plugins dir
         recursively from the PARENT, every dev folder, and the open vault root. With
         `asset:` in script-src, a plugin could `import('asset://…')` any valid-JS
         file in those trees (another plugin's bundle, a .js note in the vault): a
         file-read capability the broker never granted. Do not add it back — the
         sandbox now gets its bundle via the `source_read` broker op, where Rust picks
         the file from the caller's own directory.

         `blob:` grants no such thing: a blob is built only from bytes this realm was
         already handed, so it cannot reach the filesystem. Running plugin-authored
         code is not a new privilege — that is the plugin's own bundle either way.
         Consequence: a blob module has no base URL, so a sandboxed plugin must ship a
         single self-contained ESM (enforced in manifest validation).

         connect-src stays the IPC channel only (invoke + the ipc::Channel
         large-payload fetch path) — no direct network from this realm. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; connect-src ipc: http://ipc.localhost"
    />
    <title>Baram plugin sandbox</title>
  </head>
  <body>
    <script type="module" src="/src/sandbox/sandbox-entry.ts"></script>
  </body>
</html>
