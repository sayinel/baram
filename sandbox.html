<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- §260 sandbox-strict CSP. A meta CSP can only TIGHTEN the global one, so
         script-src must mirror the global `asset:` allowance or the plugin ESM this
         realm exists to import is blocked here (3c-1 widened only the global CSP;
         3c-2a fixes the sandbox). asset: is runtime-scoped to plugin dirs, so only
         plugin files load. Everything else stays 'none': no styles, images, fonts,
         frames or direct network — connect-src is the IPC channel only (invoke +
         the ipc::Channel large-payload fetch path). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' asset: http://asset.localhost; connect-src ipc: http://ipc.localhost"
    />
    <title>Baram plugin sandbox</title>
  </head>
  <body>
    <script type="module" src="/src/sandbox/sandbox-entry.ts"></script>
  </body>
</html>
