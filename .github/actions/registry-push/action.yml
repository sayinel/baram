name: Push a release to the registry
description: >-
  Writes the registry deploy key, rewrites the read-only HTTPS remote to SSH, and pushes one
  release (an archive and the updated index.json) to the registry repository. The caller must
  already have cloned the registry into $RUNNER_TEMP/registry and written the release into it.

# §371 6b-2 (spec 0063 D1) — ONE push for both kinds plugin-release.yml publishes. The theme job
# runs rarely, so a copy of these lines in it would be the side that drifts unnoticed — the
# argument .claude/docs/ci-contract.md makes for verify-macos-sdk.
#
# ‼️ THIS STEP RUNS NO NODE, NO NPX, NO DEPENDENCY, and that is the point of it being last and
# alone (security review MEDIUM-3, recorded in plugin-release.yml): every line of third-party code
# in the calling job has already run before the key exists on disk. Keep it that way — do not add
# a step here that executes anything but git and ssh.
#
# Inputs reach the script through `env`, never through `${{ }}` inside `run` — an expression
# pasted into a script is a script-injection surface; an environment variable is data.

inputs:
  archive:
    description: The archive's path inside the registry, e.g. plugins/baram-word-count-2.1.0.zip.
    required: true
  deploy-key:
    description: secrets.PLUGINS_DEPLOY_KEY — passed in, because a composite action cannot read secrets.
    required: true
  message:
    description: The registry commit message.
    required: true
  registry-repo:
    description: owner/name of the registry repository.
    required: true

runs:
  using: composite
  steps:
    - name: Push the release
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
        DEPLOY_KEY: ${{ inputs.deploy-key }}
        MESSAGE: ${{ inputs.message }}
        REGISTRY_REPO: ${{ inputs.registry-repo }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/plugins_deploy
        chmod 600 ~/.ssh/plugins_deploy
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/plugins_deploy -o IdentitiesOnly=yes"
        cd "$RUNNER_TEMP/registry"
        git remote set-url origin "git@github.com:${REGISTRY_REPO}.git"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # `readme/` is staged as a DIRECTORY rather than by name: the file is written only
        # when the archive had one (a plugin with a README; never a theme), and `git add` on a
        # path that does not exist aborts the step — which would fail a perfectly good release.
        # An unchanged or absent directory adds nothing and the `--quiet` check below still
        # decides whether there is anything to publish.
        git add "$ARCHIVE" index.json
        git add readme 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "::notice::Registry already contains this exact release — nothing to publish."
          exit 0
        fi
        git commit -m "$MESSAGE"
        git push origin main
