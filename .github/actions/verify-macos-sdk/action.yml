name: Verify the macOS build SDK
description: >
  Fail unless the built Baram.app is linked against macOS SDK 26 or newer, on every
  architecture slice. Caller must have produced a .app under src-tauri/target.

runs:
  using: composite
  steps:
    # ‼️ ONE implementation, two callers — release.yml (before notarization) and
    # macos-sdk.yml (the daily cron). NOT ci.yml's macos job: that one is Clippy
    # and cargo test on a rust path filter, and it never builds a .app for this
    # to read. The rule is about the runner image, so it can regress
    # with no change to our code at all; a second copy of it would be a second
    # thing to keep in agreement, and the one that drifts is the one nobody runs
    # until release day.
    #
    # This asserts the PROPERTY (what the binary is linked against) rather than the
    # runner label that was supposed to produce it: the label is an input, and only
    # the Mach-O load command says what actually happened. v0.7.0 shipped from
    # macos-15 and reported `sdk 15.5` — an opaque light titlebar over a dark app,
    # because macOS 26 draws the modern window chrome only for binaries linked
    # against the 26 SDK and offers no key to opt in when you were not.
    - name: Verify the macOS build SDK
      shell: bash
      run: |
        fail() { echo "::error::$1"; exit 1; }

        APP="$(find src-tauri/target -type d -name 'Baram.app' | head -n1)"
        [ -n "$APP" ] || fail "Baram.app not found under src-tauri/target"
        BIN="$(find "$APP/Contents/MacOS" -type f -perm -111 | head -n1)"
        [ -n "$BIN" ] || fail "no executable in $APP/Contents/MacOS"

        # A universal binary carries one LC_BUILD_VERSION per architecture, so
        # every slice has to answer — a check that reads only the first would pass
        # on a build where one arch came from a different toolchain.
        SDKS="$(otool -l "$BIN" | awk '/^ *sdk /{print $2}')"
        echo "$BIN is linked against macOS SDK: ${SDKS:-<none>}"
        [ -n "$SDKS" ] || fail "no LC_BUILD_VERSION sdk found in $BIN"

        for SDK in $SDKS; do
          case "$SDK" in
            *[!0-9.]*) fail "unparsable SDK version '$SDK' in $BIN" ;;
          esac
          [ "${SDK%%.*}" -ge 26 ] \
            || fail "built against macOS SDK $SDK; 26 or newer is required for the modern window chrome — check the runner label in the build matrix"
        done

        echo "Build SDK verified."
