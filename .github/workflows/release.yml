name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TZ: Asia/Seoul

jobs:
  # ── Tag integrity: fail fast before spending CI/build minutes ──────
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag matches app version and sits on main
        run: |
          fail() { echo "::error::$1"; exit 1; }
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          [[ "$TAG" == "$PKG" ]] || fail "tag $TAG does not match package.json version $PKG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "tag commit $GITHUB_SHA is not on main"
          echo "Tag $TAG verified."

  # ── Run full CI ─────────────────────────────────────────────────────
  ci:
    needs: [verify-tag]
    uses: ./.github/workflows/ci.yml
    with:
      # Explicit signal for release-only CI steps — github.event_name inside
      # a called workflow is the caller's event, never 'workflow_call'.
      release: true
    permissions:
      contents: read
      pull-requests: read

  # ── Build on 3 platforms + create GitHub Release ───────────────────
  build-and-release:
    needs: [ci]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Universal Binary (Apple Silicon + Intel) from a single dmg.
          # universal-apple-darwin requires both rust targets installed.
          - platform: macos-15
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Linux stays on the OLDEST supported runner on purpose: binaries
          # link against the build machine's glibc, so building on 22.04
          # keeps .deb/.AppImage running on older distros. Do not "modernize".
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-2025
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    # 150, not 90: notarization is a queue on Apple's side, not work we do.
    # v0.6.0's first submission sat In Progress for 1h49m before Accepted,
    # which the old 90 killed at 70m in — after the build had already
    # succeeded and signed.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Pin must be a master-history SHA (release-branch SHAs can be GC'd);
      # the toolchain is selected via the input, not the ref name.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      # ── macOS Developer ID signing + notarization ──────────────────────
      # Refuse early and by name. Without this, a missing secret surfaces as a
      # base64 decode error or an ad-hoc fallback that only fails minutes later
      # inside notarization, where the message says nothing about which secret
      # was absent.
      - name: Check macOS signing secrets are present
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing macOS signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All six macOS signing secrets are present."

      # A throwaway keychain, not the runner's login keychain: the runner is
      # ephemeral, but making it the default for the job keeps codesign from
      # searching anything else and picking up a stray identity.
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          # ‼️ create-keychain does NOT put the keychain in the search list, and
          # default-keychain does not either. Without this line the identity is
          # importable but unusable: scoping a lookup to a keychain that is not
          # searched cannot reach the Apple root in SystemRootCertificates, so
          # chain validation returns CSSMERR_TP_NOT_TRUSTED and
          # `find-identity -v` reports "0 valid identities" for a perfectly good
          # certificate. Reproduced locally against this exact certificate.
          # The existing entries are preserved so system roots stay reachable.
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | sed 's/^[[:space:]]*"//;s/"$//')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          # ‼️ Developer ID Application, NOT "Apple Development". The upstream
          # Tauri example greps the latter, which is a development certificate:
          # it signs, but Apple refuses to notarize it, and the failure only
          # appears after the whole universal build has been paid for.
          security find-identity -v -p codesigning build.keychain \
            | grep -q "Developer ID Application" \
            || { echo "::error::no 'Developer ID Application' identity in the imported certificate"; exit 1; }
          echo "Developer ID certificate imported."

      # notarytool reads the key from a FILE, so the .p8 has to land on disk.
      # RUNNER_TEMP (not the workspace) keeps it out of anything that gets
      # bundled or uploaded; the cleanup step below runs even on failure.
      - name: Stage App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-api-key.p8"
          head -1 "$RUNNER_TEMP/asc-api-key.p8" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_P8 did not decode to a PEM private key"; exit 1; }
          echo "API key staged."

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        # Bounded below the job so the diagnostic step below still gets to run.
        # A job-level kill skips every remaining step, which is exactly how the
        # first attempt produced no information about why it stopped.
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing + notarization. Empty on Linux/Windows, where the
          # bundler ignores them entirely.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
        with:
          tagName: v__VERSION__
          releaseName: 'Baram v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          # Updater signing is release-only: base tauri.conf.json leaves
          # createUpdaterArtifacts off (so local/dev `tauri build` needs no
          # signing key and still produces a dmg). This release-only config
          # merge (RFC 7396) turns it on so tauri-action signs the .sig files
          # and generates latest.json. Path is relative to projectPath (./).
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      # tauri drives `notarytool submit --wait`, which waits without a bound and
      # prints nothing while it does. When the wait is what failed, the log says
      # only "Terminate orphan process (notarytool)" — the actual state lives on
      # Apple's side and had to be fetched by hand to learn that the submission
      # was still queued rather than rejected. This asks Apple directly so the
      # answer is in the run that failed.
      - name: Report notarization state on failure
        if: failure() && runner.os == 'macOS'
        run: |
          echo "Most recent submissions for this key:"
          xcrun notarytool history \
            --key "$RUNNER_TEMP/asc-api-key.p8" \
            --key-id "${{ secrets.APPLE_API_KEY }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" 2>&1 | head -30 || true
          echo
          echo "In Progress  → Apple's queue, not a defect here; re-run."
          echo "Invalid      → the binary was rejected; fetch the log with:"
          echo "               xcrun notarytool log <submission-id> --key ... --key-id ... --issuer ..."

      # The release config deletes bundle.macOS.signingIdentity so APPLE_SIGNING_IDENTITY
      # applies (see src-tauri/tauri.release.conf.json). If that merge ever stops
      # working, the bundler falls back to the base config's ad-hoc "-" — which still
      # produces a .app and a .dmg. Asserting the authority by name is what turns that
      # silent downgrade into a failed release.
      - name: Verify macOS Developer ID signature and notarization
        if: runner.os == 'macOS'
        run: |
          fail() { echo "::error::$1"; exit 1; }

          APP="$(find src-tauri/target -type d -name 'Baram.app' | head -n1)"
          [ -n "$APP" ] || fail "Baram.app not found under src-tauri/target"
          echo "Verifying: $APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          AUTH="$(codesign -dvv "$APP" 2>&1 | grep '^Authority=' | head -n1)"
          echo "$AUTH"
          case "$AUTH" in
            *"Developer ID Application"*) ;;
            *) fail "expected a Developer ID Application authority, got: ${AUTH:-<none>}" ;;
          esac

          # Hardened runtime is a notarization precondition. codesign reports it in
          # the flags line; without it notarization is rejected.
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'flags=.*runtime' \
            || fail "hardened runtime is not enabled on the app bundle"

          # Gatekeeper's own verdict, which is the thing a user's Mac actually runs.
          spctl --assess --type execute --verbose=4 "$APP"

          # The dmg is what gets downloaded, so it is the artifact that must carry a
          # stapled ticket — a notarized app inside an unstapled dmg still warns on a
          # machine that is offline at first launch.
          DMG="$(find src-tauri/target -name '*.dmg' | head -n1)"
          [ -n "$DMG" ] || fail "no .dmg found under src-tauri/target"
          xcrun stapler validate "$DMG" || fail "notarization ticket is not stapled to $DMG"

          echo "Developer ID signature verified and notarization stapled."

      # Runs even when the build fails: the key is a credential, and a cancelled
      # job would otherwise leave it on a runner image.
      - name: Remove staged API key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8"
