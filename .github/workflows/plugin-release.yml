name: Plugin Release

# Publishes a first-party plugin to the sayinel/baram-plugins registry
# (GitHub Pages). Trigger: push a tag `plugin-<dir>-v<version>` where <dir>
# is the directory under examples/plugins/ and <version> matches that
# plugin's baram-plugin.json. Spec: dev plugin-registry-hosting design.
on:
  push:
    tags: ['plugin-*']

# Serialize releases: two plugin tags at once must not race on the
# registry-repo push.
concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  REGISTRY_REPO: sayinel/baram-plugins
  BASE_URL: https://sayinel.github.io/baram-plugins/

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse and verify tag
        id: meta
        run: |
          fail() { echo "::error::$1"; exit 1; }
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^plugin-(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
            || fail "tag $TAG does not match plugin-<dir>-v<semver>"
          DIR="${BASH_REMATCH[1]}"; VERSION="${BASH_REMATCH[2]}"
          # §260 Phase 6 — WHAT MAY BE PUBLISHED, as an ALLOWLIST.
          #
          # This was a denylist naming the two test fixtures, and round 3 of the code review
          # showed why that was the wrong shape: it enumerated 2 of the 4 directories under
          # examples/plugins/, and the withheld one was already the counterexample. A tag
          # `plugin-ai-summary-v1.0.0` passed every check — denylist, version match, id regex,
          # the release-order gate (its floor is older than the app) — and would have published a
          # `trust: "trusted"` plugin to the public registry, which is exactly the thing Phase 6
          # decided not to ship. The withdrawal was enforced only by a unit test asserting the
          # LOCAL seed, a file this workflow never reads.
          #
          # Deny by default. Adding an example must not make it publishable; publishing must be a
          # deliberate edit here. Pinned by src/plugins/__tests__/malicious-fixture.test.ts, which
          # EXECUTES this step rather than scanning it.
          case "$DIR" in
            word-count) ;;
            *) fail "$DIR is not in this workflow's publishable allowlist — add it deliberately if that is the intent" ;;
          esac
          MANIFEST="examples/plugins/$DIR/baram-plugin.json"
          [[ -f "$MANIFEST" ]] || fail "no manifest at $MANIFEST"
          MANIFEST_VERSION="$(node -p "require('./$MANIFEST').version")"
          [[ "$VERSION" == "$MANIFEST_VERSION" ]] \
            || fail "tag version $VERSION != manifest version $MANIFEST_VERSION"
          PLUGIN_ID="$(node -p "require('./$MANIFEST').id")"
          [[ "$PLUGIN_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]] \
            || fail "manifest id '$PLUGIN_ID' must match ^[a-z0-9][a-z0-9-]*$"
          # §260 Phase 6 — only the SANDBOXED tier is published, independently of the allowlist
          # above. Two conditions rather than one because they fail for different reasons: the
          # allowlist is "is this directory meant to ship", this is "is this tier fit to ship".
          # A published trusted plugin would train users to click through the full-trust
          # acknowledgement for ordinary functionality, which is the opposite of what that
          # acknowledgement exists for.
          TRUST="$(node -p "require('./$MANIFEST').trust || ''")"
          [[ "$TRUST" == "sandboxed" ]] \
            || fail "manifest trust is '$TRUST'; only sandboxed plugins are published"
          # §260 Phase 6 code review (H1) — the app must not be BEHIND the floor the plugin
          # declares. `engines.baram` is validated nowhere at install time (the frontend only
          # checks that the field is a non-empty string), so publishing a plugin whose floor the
          # shipped app does not meet gives those users an enabled Install for something that
          # throws on activate — and destroys a working older version on update.
          #
          # ‼️ CAVEAT: `package.json` is bumped when the release is PREPARED, and the GitHub
          # release is published by hand afterwards. So this proves "the app version has been
          # bumped to at least the floor", not "that version is in users' hands". Strictly
          # better than nothing; the ordering itself is still a human step (see the phase 6
          # spec §7).
          # Compared numerically in plain node — NOT with `sort -V`, and NOT with the `semver`
          # package (round-3 LOW plus a defect in the first attempt at this fix):
          #   • `sort -V` is a version-ish string sort, not a semver comparator; it ordered a
          #     prerelease `0.5.0-beta.1` as satisfying a `0.5.0` floor.
          #   • `require("semver")` would NOT RESOLVE here. This job never runs `npm ci` at the
          #     repo root (only inside the plugin directory, two steps later), and semver is a
          #     transitive package rather than a declared dependency. Reading a JSON file by
          #     relative path needs no node_modules; requiring a package does.
          # A prerelease app version fails closed: `0.5.0-beta.1` is not the release that ships
          # the floor, so it must not authorize publishing against it.
          APP_VERSION="$(node -p "require('./package.json').version")"
          # `(engines||{})` rather than `engines.baram` (round-4 LOW-1): a manifest with no
          # `engines` made this assignment throw a raw Node stack, and `set -e` then aborted the
          # job with NO `::error::` annotation at all — a real refusal that looked like a crash.
          # Now it comes through as an empty range and is reported by the check below.
          RANGE="$(node -p "((require('./$MANIFEST').engines)||{}).baram || ''")"
          # Exit 2 means "the inputs are malformed", 1 means "the app is genuinely behind"
          # (round-4 LOW-2). One status for both made a legal-but-unsupported range like `^0.5.0`
          # produce the annotation "release the app first", which is not what happened.
          set +e
          node -e '
            const [app, range] = process.argv.slice(1);
            const floor = /^>=\s*(\d+)\.(\d+)\.(\d+)$/.exec(range);
            if (!floor) { console.error(`engines.baram "${range}" must be of the form ">=X.Y.Z"`); process.exit(2); }
            const appParts = /^(\d+)\.(\d+)\.(\d+)$/.exec(app);
            if (!appParts) { console.error(`app version "${app}" is not a plain release version`); process.exit(2); }
            const a = appParts.slice(1).map(Number), f = floor.slice(1).map(Number);
            const ok = a[0] !== f[0] ? a[0] > f[0] : a[1] !== f[1] ? a[1] > f[1] : a[2] >= f[2];
            process.exit(ok ? 0 : 1);
          ' "$APP_VERSION" "$RANGE"
          VERSION_CHECK=$?
          set -e
          case "$VERSION_CHECK" in
            0) ;;
            1) fail "app version $APP_VERSION does not satisfy this plugin's engines.baram ($RANGE) — release the app first" ;;
            2) fail "cannot compare versions: app '$APP_VERSION' / engines.baram '$RANGE' (see the message above)" ;;
            *) fail "the version comparison itself failed (exit $VERSION_CHECK) — this is a bug in this workflow, not a refusal" ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "tag commit $GITHUB_SHA is not on main"
          {
            echo "dir=$DIR"
            echo "version=$VERSION"
            echo "plugin_id=$PLUGIN_ID"
            echo "zip_name=$PLUGIN_ID-$VERSION.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Build plugin
        working-directory: examples/plugins/${{ steps.meta.outputs.dir }}
        run: |
          npm ci
          npm run build

      # Packaging contract: baram-plugin.json at the archive ROOT — zip the
      # directory CONTENTS, never a wrapping folder. Runtime files only.
      - name: Package ZIP
        working-directory: examples/plugins/${{ steps.meta.outputs.dir }}
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          zip -r "$RUNNER_TEMP/$ZIP_NAME" \
            baram-plugin.json dist README.md

      - name: Compute checksum
        id: sum
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          CHECKSUM="$(sha256sum "$RUNNER_TEMP/$ZIP_NAME" | cut -d' ' -f1)"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Push ZIP + updated index to registry repo
        env:
          DEPLOY_KEY: ${{ secrets.PLUGINS_DEPLOY_KEY }}
          DIR: ${{ steps.meta.outputs.dir }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          PLUGIN_ID: ${{ steps.meta.outputs.plugin_id }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHECKSUM: ${{ steps.sum.outputs.checksum }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/plugins_deploy
          chmod 600 ~/.ssh/plugins_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/plugins_deploy -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${REGISTRY_REPO}.git" "$RUNNER_TEMP/registry"
          mkdir -p "$RUNNER_TEMP/registry/plugins"
          cp "$RUNNER_TEMP/$ZIP_NAME" "$RUNNER_TEMP/registry/plugins/"
          node scripts/update-registry-index.mjs \
            --index "$RUNNER_TEMP/registry/index.json" \
            --manifest "examples/plugins/$DIR/baram-plugin.json" \
            --zip-name "$ZIP_NAME" \
            --checksum "$CHECKSUM" \
            --base-url "$BASE_URL"
          cd "$RUNNER_TEMP/registry"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "plugins/$ZIP_NAME" index.json
          if git diff --cached --quiet; then
            echo "::notice::Registry already contains this exact release — nothing to publish."
            exit 0
          fi
          git commit -m "release: $PLUGIN_ID $VERSION"
          git push origin main
