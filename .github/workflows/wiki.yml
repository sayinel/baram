name: Publish Wiki

# wiki 소스는 리포의 `wiki/` 에 있고 PR 에서 `npm run lint:wiki` 가 검사한다.
# 이 워크플로는 검사가 아니라 **게시**다 — main 에 들어온 것을 wiki 탭으로 옮긴다.
on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

# 같은 리포의 wiki 는 기본 GITHUB_TOKEN 으로 push 할 수 있다 — PAT 불필요.
permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # ‼️ `persist-credentials: false` — checkout 이 기본으로 `.git/config` 에 남기는
      #    `AUTHORIZATION: basic …` 를 만들지 않는다. 이 잡은 그 자격을 쓰지 않는다(wiki
      #    clone 은 아래에서 `GH_TOKEN` 으로 따로 인증한다). 남겨 두면 `wiki/X.md` 를
      #    `.git/config` 로 향하는 심볼릭 링크로 만든 PR 이 merge 됐을 때, 아래 `cp` 가
      #    링크를 따라가 **토큰을 공개 wiki 에 게시한다.** 표적을 없애는 쪽이 경로를 막는
      #    것보다 확실하다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ‼️ 서드파티 wiki 액션을 쓰지 않는다. 하는 일이 clone·복사·push 뿐이라
      #    SHA 핀으로 관리할 의존성을 하나 더 만들 이유가 없다.
      - name: Publish wiki/ to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ‼️ 전제: GitHub wiki 저장소는 **웹 UI 에서 첫 페이지를 만들어야 비로소 존재한다.**
          #    `has_wiki: true` 여도 초기화 전이면 아래 clone 이 "repository not found" 로
          #    죽는다 — 리포의 결함이 아니다. 이 전제가 코드 밖에만 있으면 첫 merge 에서
          #    main 이 무관한 이유로 빨개지고 아무도 원인을 모른다.
          #
          # 얕은 clone 을 쓰지 않는다. wiki 는 markdown 몇 장이라 전체를 받아도 비용이
          # 없는데, shallow clone 에서의 push 는 서버 설정에 따라 거부될 수 있다 —
          # 이득 0 인 위험을 첫 실행까지 끌고 갈 이유가 없다.
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "${RUNNER_TEMP}/wiki" \
            || { echo "::error::wiki 가 초기화되지 않았다 — 웹 UI 에서 첫 페이지를 만든 뒤 재실행할 것"; exit 1; }
          # 삭제된 페이지가 wiki 에 남지 않도록 먼저 비운다. glob 이 비어도 실패하지
          # 않게 find 를 쓴다.
          find "${RUNNER_TEMP}/wiki" -maxdepth 1 -name '*.md' -delete
          cp wiki/*.md "${RUNNER_TEMP}/wiki/"
          cd "${RUNNER_TEMP}/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs: publish wiki from ${GITHUB_SHA}"
          git push
