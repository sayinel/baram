name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      # ‼️ 사이트 밖이지만 사이트 게이트의 **입력**이다. check-glossary.mjs 가 한국어 제품
      #    용어를 이 파일에서 파생 검증하므로, 여기 없으면 앱이 용어를 바꿀 때 이 워크플로가
      #    돌지 않고 ci.yml 은 사이트를 보지 않아 **두 워크플로가 모두 초록인 채로 사전이
      #    낡는다.** site/tests/workflow-inputs.test.mjs 가 이 목록을 게이트에서 파생시킨다.
      - "src/i18n/ko.json"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "src/i18n/ko.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Install site deps (independent npm project)
        run: npm ci
        working-directory: site
      - name: Verify site (build · dist 산출물 · 페이지 게이트 · 테스트 · 타입)
        run: npm run verify
        working-directory: site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
