name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release:
        description: 'Set by release.yml — enables release-only steps (build smoke test)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # Only PRs cancel superseded runs. NOTE: github.event_name is NEVER
  # 'workflow_call' in a called workflow (the caller's event propagates),
  # so the old `!= 'workflow_call'` condition was always true.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  TZ: Asia/Seoul

jobs:
  # ── Path Change Detection ────────────────────────────────────────
  # PR: paths-filter decides whether the rust job must run.
  # Everything else (main push, release call): decide outputs true,
  # so rust always runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      # No checkout: paths-filter reads PR changes via the API.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-node/**'
      - name: Determine rust job necessity
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
          fi

  # ── Lint (all events) ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Lint (prettier + eslint + stylelint + typecheck + knip)
        run: npm run lint

      # ‼️ The rust job runs `npm run build` too — this is NOT its duplicate.
      # rust skips on any PR touching no rust path, which is exactly the shape
      # this covers: a frontend-only or dependency-only change. Before this
      # step, `vite build` had never run on PRs like #566 (tests only) or
      # #578/#581 (the tiptap and vitest bumps). `npm run lint` already runs
      # tsc, so what this adds over typecheck is the bundle itself.
      - name: Production build (vite bundle)
        run: npm run build

  # ── Security: Secret Detection (all events) ────────────────────────
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # NOTE: curl-pinned installs are invisible to Dependabot —
        # bump the version and checksum together, by hand.
        run: |
          GITLEAKS_VERSION="v8.30.1"
          EXPECTED_SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "${EXPECTED_SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar xz -C /usr/local/bin -f gitleaks.tar.gz
          rm gitleaks.tar.gz
      - name: Run gitleaks (PR — changed commits only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts "$BASE..$HEAD"
      - name: Run gitleaks (full history)
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  # ── Dependency licenses & supply chain (cargo-deny) ────────────────
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-deny
      - name: cargo-deny (licenses, bans, sources)
        working-directory: src-tauri
        run: cargo deny check licenses bans sources

  # ── Test (all events) ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Vitest
        run: npm run test

  # ── Rust: fmt + clippy + test + build smoke ────────────────────────
  rust:
    needs: [changes]
    # Runs only when changes succeeded AND said rust is needed
    # (main push / release call: decide always outputs true).
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The Pandoc export policy (issue 545/544) is proven by an `#[ignore]`d
      # test that runs a real pandoc over docx/epub/latex/rst output and checks
      # what landed in the archives. Ubuntu's apt package is the deliberate
      # choice: noble ships pandoc 3.1.x, which makes this run the minimum
      # supported version rather than whatever is newest — a user's Homebrew
      # or Chocolatey pandoc is at least this. `pandoc --version` fails the
      # job loudly if the package ever goes missing, instead of the test's
      # panic. Not added to the macOS job on purpose: that job answers Darwin
      # compilation and case-insensitive-filesystem questions (see
      # .claude/docs/ci-contract.md), and a Homebrew download would broaden it.
      - name: Install pandoc (export policy smoke)
        run: |
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      # Pin must be a master-history SHA (release-branch SHAs can be GC'd);
      # the toolchain is selected via the input, not the ref name.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Rust fmt check
        run: npm run rust:fmt

      - name: Build frontend (required for Rust compilation)
        run: npm run build

      - name: Clippy
        run: npm run rust:_clippy

      - name: Cargo test
        run: npm run rust:_test

      # Ignored on purpose in the normal run (needs the pandoc binary); the
      # name filter keeps the other ignored tests — live OpenRouter calls, the
      # OS keyring, timing benches — out of it. The `--list` line first: a
      # filter that matches nothing is a green run of zero tests, so at least
      # one `pandoc_smoke_*` test must be SEEN before anything is run — if the
      # tests were renamed or moved, this fails loudly instead of silently
      # switching the coverage off. Cargo is invoked directly rather than
      # through `npm run rust:_test`, so a package.json edit (outside the rust
      # path filter) cannot change what this step does.
      - name: Pandoc export policy smoke (real pandoc)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml pandoc_smoke -- --ignored --list \
            | grep -E '(^|::)pandoc_smoke_[a-z0-9_]+: test$'
          cargo test --manifest-path src-tauri/Cargo.toml pandoc_smoke -- --ignored

      - name: Tauri build smoke test (release only)
        # github.event_name is NEVER 'workflow_call' inside a called workflow —
        # the caller's event propagates — so release.yml passes an input instead.
        if: inputs.release == true
        run: npm run tauri build -- --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

  # ── macOS Rust (the Darwin half of the crate, on every rust change) ─
  # ‼️ WHY THIS EXISTS. Every other job here runs on ubuntu, so until v0.7.1 the
  # macOS half of the release was first exercised on release day. v0.7.0 shipped
  # an opaque light titlebar because the matrix was on macos-15, and nothing
  # before the release could have said so.
  #
  # What THIS job answers — all three depend on the diff, which is why they are
  # gated on the rust path filter and run per PR:
  #   1. `macos-26` still resolves to a runner (a label is not a guarantee)
  #   2. the `cfg(target_os = "macos")` code in lib.rs / menu.rs /
  #      plugin/storage.rs compiles at all — ubuntu never sees it
  #   3. the tests still mean something on a case-INSENSITIVE filesystem
  #
  # ‼️ The SDK assertion is NOT here — it lives in macos-sdk.yml. That rule is a
  # property of the runner IMAGE, not of our source: a rust diff cannot change
  # it, and it can regress with no change to this repository at all. Gating it
  # on rust paths cost ~12 minutes of `tauri build` on every rust PR to re-ask a
  # question the PR could not have affected, and still went blind through any
  # week without a rust merge. It is a daily schedule now, which is both cheaper
  # and strictly faster to notice. Do not move it back here.
  #
  # No `tauri build` here for the same reason the ubuntu rust job has none
  # outside a release call: nothing in a PR exercises the release profile, on
  # either platform. Clippy already compiles --all-targets.
  macos:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      # Pin must be a master-history SHA (release-branch SHAs can be GC'd);
      # the toolchain is selected via the input, not the ref name.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      # `shared-key` (rather than the default, which keys on the job id) is what
      # lets macos-sdk.yml's read-only restore hit this cache — mainly the cargo
      # registry and git checkouts, since that job builds the other profile.
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: macos

      - name: Build frontend (required for Rust compilation)
        run: npm run build

      # The Darwin-only code paths, linted where they actually compile.
      - name: Clippy
        run: npm run rust:_clippy

      # Not a duplicate of the ubuntu run. macOS mounts a case-INSENSITIVE
      # filesystem by default, and this crate is mostly paths — vault roots,
      # registered contexts, link-index keys. A test that distinguishes `Notes`
      # from `notes` passes on ubuntu and is meaningless here, which is the kind
      # of difference only running them on both can show. Clippy above already
      # compiled --all-targets, so this is the run, not another build.
      - name: Cargo test
        run: npm run rust:_test

  # ── CI Gate ────────────────────────────────────────────────────────
  ci-pass:
    if: always()
    needs: [changes, lint, security, deny, test, rust, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          RUST_NEEDED: ${{ needs.changes.outputs.rust }}
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
          DENY: ${{ needs.deny.result }}
          TEST: ${{ needs.test.result }}
          RUST: ${{ needs.rust.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # These must succeed on every event — a skip here means something
          # upstream broke, not an intended skip.
          [[ "$CHANGES"  == "success" ]] || fail "changes: $CHANGES"
          [[ "$LINT"     == "success" ]] || fail "lint: $LINT"
          [[ "$SECURITY" == "success" ]] || fail "security: $SECURITY"
          [[ "$DENY"     == "success" ]] || fail "deny: $DENY"
          [[ "$TEST"     == "success" ]] || fail "test: $TEST"
          # rust must succeed everywhere, with exactly one legitimate skip:
          # a PR whose changes touched no rust-related paths.
          if [[ "$RUST" != "success" ]]; then
            [[ "$EVENT" == "pull_request" && "$RUST_NEEDED" == "false" && "$RUST" == "skipped" ]] \
              || fail "rust: $RUST (event=$EVENT, rust-needed=$RUST_NEEDED)"
          fi
          # macos is gated on the same filter as rust, so it earns the same single
          # exemption and no other. Anything else — a cancelled job, a runner that
          # never came up — is a red light: this is the only place the Darwin half
          # of the crate is compiled and run before release day. (The SDK rule is
          # not gated here at all; macos-sdk.yml owns it on a schedule.)
          if [[ "$MACOS" != "success" ]]; then
            [[ "$EVENT" == "pull_request" && "$RUST_NEEDED" == "false" && "$MACOS" == "skipped" ]] \
              || fail "macos: $MACOS (event=$EVENT, rust-needed=$RUST_NEEDED)"
          fi
          echo "All checks passed."
