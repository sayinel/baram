# TEMPORARY — removed before this branch is proposed. Runs ci.yml's `windows`
# job on pushes to this branch only, because ci.yml itself runs on PRs and main.
# Diagnostic differences from the real job: the test step runs even when Clippy
# failed, and `--no-fail-fast` reports every failing test binary in one run.
name: Windows probe (temporary)

on:
  push:
    branches: [ci/windows-rust-tests]

concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TZ: Asia/Seoul

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows

      - name: Build frontend (required for Rust compilation)
        shell: bash
        run: npm run build

      - name: Clippy
        shell: bash
        run: npm run rust:_clippy

      - name: Cargo test
        if: ${{ !cancelled() }}
        shell: bash
        run: npm run rust:_test -- --no-fail-fast
