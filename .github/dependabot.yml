version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      # react and react-dom assert an exact version match at module load —
      # bumping one without the other throws on every jsdom render (PR 399)
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tiptap:
        patterns: ["@tiptap/*"]
      codemirror:
        patterns: ["@codemirror/*"]
      tauri-js:
        patterns: ["@tauri-apps/*"]
      testing:
        patterns: ["vitest", "@testing-library/*", "jsdom"]
      linting:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "stylelint*", "prettier*"]
      dev-tools:
        patterns: ["husky", "lint-staged", "@commitlint/*"]
      # The editor's markdown grammar — the Rust link index emulates what this
      # stack reads (src-tauri/src/md/literal/), so it moves in one PR that
      # the measured-stack sentinel (literal-measured-stack.test.ts) turns red
      # until the emulation is re-measured (issue 669)
      remark:
        patterns: ["remark*", "micromark*", "mdast-util-*", "unified"]
    ignore:
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
      # typescript-eslint peer allows <6.1.0 — remove when TS 7 is supported
      # (see issues 202/207)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # stylelint-config-recess-order 7.10.0 peers stylelint ^16.18.0 || ^17.0.0,
      # and stylelint-config-standard 41 peers stylelint ^18.0.0 — offering
      # either major makes `npm ci` fail with ERESOLVE (PRs 970, 989). Remove
      # both once recess-order accepts stylelint 18
      # (stormwarning/stylelint-config-recess-order#504)
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint-config-standard"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      tauri-core:
        patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
    ignore:
      - dependency-name: "tauri"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri-build"
        update-types: ["version-update:semver-major"]
